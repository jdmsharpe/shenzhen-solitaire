[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shenzhen-solitaire"
version = "0.1.0"
description = "A solver and screenshot recognizer for SHENZHEN I/O Solitaire"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
ocr = ["numpy>=1.23", "opencv-python-headless>=4.10,<6"]

[project.scripts]
shenzhen-solitaire = "shenzhen_solitaire.solver:main"

[dependency-groups]
dev = ["mypy>=1.11", "ruff>=0.12"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["shenzhen_solitaire*"]

[tool.setuptools.package-data]
shenzhen_solitaire = ["*.png"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
files = ["shenzhen_solitaire", "test"]

# python_version is deliberately unset, so mypy checks against the interpreter
# in use rather than the 3.10 floor in requires-python. Pinning it to 3.10 made
# mypy read the installed numpy's stubs as 3.10 code and reject their PEP 695
# syntax -- a pairing that cannot arise, since that numpy needs 3.12 or newer.

# The OCR dependencies are optional, so mypy has to run with or without them.
# This covers the without case only: both ship type information, so when they
# are installed mypy resolves them normally and checks vision.py against them.
[[tool.mypy.overrides]]
module = ["cv2", "numpy"]
ignore_missing_imports = true
